name: WhatsApp bridge checks

on:
  push:
    paths:
      - "whatsapp-cloud/**"\n      - "index.html"
      - ".github/workflows/whatsapp-bridge-check.yml"
  pull_request:
    paths:
      - "whatsapp-cloud/**"\n      - "index.html"
      - ".github/workflows/whatsapp-bridge-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check\n      - name: Check PWA inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          Path("/tmp/almasar-pwa-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/almasar-pwa-check.js

