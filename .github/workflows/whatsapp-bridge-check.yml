name: WhatsApp bridge checks

on:
  push:
    paths:
      - "whatsapp-cloud/**"
      - ".github/workflows/whatsapp-bridge-check.yml"
  pull_request:
    paths:
      - "whatsapp-cloud/**"
      - ".github/workflows/whatsapp-bridge-check.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
